# Content Library — the agency-wide inspiration folders (one Discord forum per genre, gallery view).
# The bot creates/updates the channels from this file on boot. Add a genre = add an entry; rename the `name` and the
# channel renames itself. Never delete a slug that has posts — set `active: false` instead.
#
# Seed accounts live in the database (add from Discord: /library source add), so Dan can grow them without a deploy.
# Hashtags here are defaults; `/library source add` can add more per genre too.

scout:
  cron: "0 7 * * *"          # daily 7 AM, DEFAULT_TIMEZONE — Dan: "every day at 7 AM"
  picks_per_model: 3         # after the scout, each model gets her top picks (her lanes) in her #general
  per_hashtag: 15            # Apify results per hashtag per run
  per_account: 6             # Apify results per seed account per run
  newer_than: "7 days"
  classify_top: 8            # candidates sent to Claude per genre (ranked by engagement first)
  keep: 3                    # max posts per genre per run (Dan: "top 3")
  min_score: 0.6             # Claude's "worth copying" bar (the prompt says < 0.6 = not worth posting)
  # The creators whose vibe IS the library (owners, 2026-09-17): every candidate is judged against them, and their profiles
  # are scanned every run and filed wherever they belong. Edit freely — handles without @.
  reference_accounts: [cecerose, avaxreyess, sophieraiin, juliafilippo_, arikytsya, jellybeanbrains3, tak0bell]

genres:
  - slug: skits
    name: Skits
    emoji: "🎭"
    description: Scripted bit with a setup and a punchline, usually a second person or a POV; the joke carries the video and men share it.
    hashtags: [skit, comedyskit, pov]

  - slug: dance
    name: Dance
    emoji: "💃"
    description: Dance trend / choreography / dance challenge with a trending sound; the movement is the content.
    hashtags: [dancechallenge, dancetrend, dancereels]

  - slug: collabs
    name: Collabs
    emoji: "👯"
    description: Group of girls (2+, usually 3+) doing a bit together — friend groups, trips, group trends. Men comment on the group and pick a favorite.
    hashtags: [girlsquad, girlstrip, besties]

  - slug: pool
    name: Pool
    emoji: "🏊"
    description: At a pool — swim, float, poolside; the setting is the hook, swimwear is allowed, captions stay clean.
    hashtags: [poolday, poolside, pooltime]

  - slug: beach
    name: Beach
    emoji: "🏖️"
    description: Beach / ocean / sand setting; swimwear-adjacent but the beach and a bit (question, joke, reveal) are the point.
    hashtags: [beachday, beachgirl, beachlife]

  - slug: words-on-screen
    name: Words on Screen
    emoji: "💬"
    description: Creative on-screen text ties the video together — a confession, a question, a "when he…", "rate me", "which one"; the text is what men reply to.
    hashtags: [relatable, pov, girlsbelike]

  - slug: big-boobs
    name: Big Boobs
    emoji: "💋"
    description: Content where the framing/outfit centers the chest (still IG-safe); engagement is driven by that.
    hashtags: []          # hashtag search is junk for this lane — seed accounts only

  - slug: podcast-questions
    name: Podcast Questions
    emoji: "🎙️"
    description: Mic in hand — street interviews, podcast-style questions to strangers or friends, hot-take answers men argue with in the comments.
    hashtags: [streetinterview, podcastquestions, askingstrangers]

  - slug: golf
    name: Golf
    emoji: "⛳"
    description: Golf course / range / golf outfit content; swing videos, cart videos, "rate my swing", golf-girl humor in a male space.
    hashtags: [golfgirl, golfgirls, golfoutfit]

  - slug: gym-girl
    name: Gym Girl
    emoji: "🏋️"
    description: Gym / workout / fit-check-at-the-gym; form, progress, gym humor, "things men do at the gym".
    hashtags: [gymgirl, gymgirls, gymfit]

  - slug: funny
    name: Funny
    emoji: "😂"
    description: The video is funny first — reaction, relatable humor, self-deprecating, chaos men send to a friend. Not a scripted skit.
    hashtags: [funnyreels, comedyreels, girlsbelike]

  - slug: transitions
    name: Transitions
    emoji: "🔄"
    description: Outfit / location / before-after transitions cut on the beat; casual → glam reveals; the edit is the hook.
    hashtags: [transition, outfittransition, fitcheck]

  - slug: car
    name: Car
    emoji: "🚗"
    description: In or around a car — driving, car singing, car outfit check, car-girl aesthetic, cars & coffee.
    hashtags: [cargirl, cargirls, carsandcoffee]

  - slug: personality
    name: Personality
    emoji: "🌟"
    description: Talking to camera — storytime, hot takes, GRWM chat, day-in-life with something withheld; she is the content, men fall for the personality.
    hashtags: [storytime, grwm, hottake]

  # Added 2026-09-18 (Dan: "goth, sandwich maker TRAD wife, emo girl, cosplay"). Same house rules as every folder —
  # the folder is the setting or the bit; the sex appeal is the reason it is in the library.
  - slug: goth
    name: Goth Girl
    emoji: "🖤"
    description: Goth / alt look — black outfits, dark makeup, fishnets, chokers, dyed hair; the "goth gf" bit, and the contrast between the dark look and a sweet or flirty delivery is what men comment on.
    hashtags: [gothgirl, gothgf, altgirl]

  - slug: emo
    name: Emo Girl
    emoji: "🎸"
    description: Emo / scene / e-girl look — side bangs, band tees, heavy eyeliner, striped sleeves, 2000s pop-punk nostalgia; "emo girl" bits and throwback humor, the fit is the tease.
    hashtags: [emogirl, egirl, scenegirl]

  - slug: trad-wife
    name: Trad Wife
    emoji: "🥪"
    description: Homemaker bit — making him a sandwich or a meal in a dress or apron, "would you eat my…" questions, 1950s-housewife aesthetic played flirty; the kitchen is the setting, the fit and the tease make it library material (a plain recipe video is not).
    hashtags: [tradwife, tradwifelife, housewifeaesthetic]

  - slug: cosplay
    name: Cosplay & Costumes
    emoji: "🧝"
    description: Cosplay, character outfits, costume try-ons, convention and Halloween content — the character or the costume reveal is the hook; men comment on the character and the fit.
    hashtags: [cosplay, cosplaygirl, halloweencostume]

  # Added 2026-09-18 from Dan's creator list. These are IDENTITY niches — a girl only gets them as lanes if she is willing to
  # embrace the whole identity, so they are not routed to everyone (model.yaml → lanes decides).
  - slug: hot-girl-filler
    name: Hot Girl Filler
    emoji: "🔥"
    description: The everyday "look at me" content between the bits — mirror fits, walking shots, car-seat video, pose-and-smile, GRWM with no story; the girl and the fit ARE the content, a look-to-camera or a tease makes it land; quick to film, posted daily to keep the feed hot.
    hashtags: [fitcheck, ootd, mirrorselfie]

  - slug: of-personality
    name: OF Personality
    emoji: "💅"
    description: The OF-creator personality play — she is the product; a recurring character, catchphrases, flirty chaos, direct-to-camera with the funnel in mind. Study the persona and how she keeps men coming back, not one video. (Talking-head storytime with no persona belongs in Personality.)
    hashtags: [itgirl, maincharacter, hotgirlsummer]
