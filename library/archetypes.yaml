# Creator archetypes ("buckets") + the roster of girls. Folders (genres.yaml) are FORMATS; a bucket is a creator PROFILE:
# the folders it pulls from (her lanes — the first one is the primary folder) and the reference creators who do it best.
#
#   boot        every reference creator below is seeded into the daily scout under the bucket's PRIMARY lane — the first one — (bot.library_sources,
#               weight 1.1, added_by "archetype") — nothing to run, no SQL.
#   /model add  a girl on the roster gets her bucket's lanes and ALL reference creators (bucket + her own) as the seed accounts
#               of her personal 10 AM reels scout, instead of the research guess. The weekly refresh keeps them.
#   roster key  her model slug, its first part, or her first name — lowercase ("madi" matches madi, madi-ruve, "Madi Ruve").
#
# Dan (Nov 18, 2026): "make sure we have seed creators and versions for all of the girls and niches and constantly look for new
# as well" — the scout now promotes creators it keeps videos from on its own (see docs/content-library.md → Discovery); this file
# is for the ones the owners name. Handles without @. Locked (18+) creators are listed in docs/archetypes.md until the throwaway
# Instagram account is connected; the logged-out scraper cannot see them.

