title: "Content House — December"
emoji: "🏠"
intro: "Every video the owners picked for the December content house, sorted the way the planning sheet is: shared formats first, then each girl's own list. Each one links to its library post (video + why it works + how to copy it). Tap 📋 Copy this on any library post to put it on your board."
