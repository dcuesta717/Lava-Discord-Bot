# Content House — December (from the owners' Google Sheet "Content house december", 25 tabs, Nov 17 2026).
# One section = one tab of the sheet = one thread in the 🏠 content-house forum. Every link is HAND-PICKED by the owners,
# so the import files + annotates every one (keep_all) — it never rejects. `folder` forces the library folder, `hint` steers
# Claude's notes, `person` = a girl's own list (lands on her reels board the moment she is onboarded; name matches the
# model slug or first name). A url entry may be `{url, note}` to carry the owners' note from the sheet.
# Re-import = add / fix a link here; links already imported are skipped. Owners never need this file — Discord shows it all.

