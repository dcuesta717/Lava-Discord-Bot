# Deploy on push to main. Pick ONE of the two jobs and delete the other.
name: deploy
on:
  push:
    branches: [main]
jobs:
  # Option A — Railway (simplest; add RAILWAY_TOKEN secret, link the project once with `railway link`)
  railway:
    if: ${{ vars.DEPLOY_TARGET == 'railway' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i -g @railway/cli
      - run: railway up --service lava-discord-bot --detach
        env: { RAILWAY_TOKEN: "${{ secrets.RAILWAY_TOKEN }}" }

  # Option B — your own VPS with pm2 (add SSH_HOST / SSH_USER / SSH_KEY secrets)
  vps:
    if: ${{ vars.DEPLOY_TARGET == 'vps' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with: { ssh-private-key: "${{ secrets.SSH_KEY }}" }
      - run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            cd ~/lava-discord-bot && git pull --ff-only && npm ci && npm run build && npm run register-commands && pm2 restart lava-bot || pm2 start dist/src/index.js --name lava-bot'
