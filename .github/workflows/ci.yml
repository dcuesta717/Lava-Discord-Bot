name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - name: validate model configs
        run: npx tsx -e "import('./src/config/models.ts').then(m => console.log(m.loadModels().map(x => x.slug)))"
